<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリを開く</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ぱずこら" />
    <meta property="og:description" content="ぱずこらをダウンロード" />
    <meta property="og:url" content="https://pazzcolla-redirect.yuunium.jp/" />
    <meta property="og:image" content="https://pazzcolla-redirect.yuunium.jp/og_image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="ぱずこらのロゴ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ぱずこら" />
    <meta name="twitter:description" content="ぱずこらをダウンロード" />
    <meta name="twitter:image" content="https://pazzcolla-redirect.yuunium.jp/og_image.jpg" />
    <meta name="twitter:image:alt" content="ぱずこらのロゴ" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #172033;
        font-family: system-ui, sans-serif;
      }
      main { max-width: 440px; padding: 32px 24px; text-align: center; }
      h1 { font-size: 24px; }
      p { line-height: 1.8; }
      nav { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 24px; }
      nav a {
        display: block;
        width: 126px; /* ボタンの横幅はここで調整 */
        min-width: 0;
      }
      nav a img { display: block; width: 100%; height: auto; }
      a:hover { opacity: 0.85; }
      a:focus-visible { outline: 3px solid #172033; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>リダイレクトします</h1>
      <p id="message" role="status">ストアへ自動遷移しない場合はリンクを選んでください。</p>
      <nav aria-label="ダウンロード先">
        <a id="ios-link" href="https://apps.apple.com/jp/app/%E3%81%B1%E3%81%9A%E3%81%93%E3%82%89/id6751093839">
          <img src="./button_iPhone.png" alt="App Storeからダウンロード" />
        </a>
        <a id="android-link" href="https://play.google.com/store/apps/details?id=com.yuunium.pazzcolla">
          <img src="./button_Android.png" alt="Google Playで手に入れよう" />
        </a>
      </nav>
      <noscript><p>自動転送にはJavaScriptが必要です。上のリンクから進んでください。</p></noscript>
    </main>
    <script>
      const userAgent = navigator.userAgent;
      const isAndroid = /Android/i.test(userAgent);
      // Android以外（iPhone・iPad・Mac・Windows PCなど）はiOS用リンクへ転送。
       const target = isAndroid
        ? document.getElementById("android-link")
        : document.getElementById("ios-link");

      if (target) {
        document.getElementById("message").textContent =
          "移動しています。自動で移動しない場合は、下のリンクを押してください。";
        // 戻る操作でこのページから再転送されないよう、履歴を置き換える。
        window.location.replace(target.href);
      }
    </script>
  </body>
</html>
